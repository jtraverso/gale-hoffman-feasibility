fidelity:
  divergences: >-
    Capacities are finite nonnegative reals (Gale allows +∞) or nonnegative integers. Gale's flow
    on N × N is a function f : N → N → ℝ with f x y + f y x = 0 and f ≤ c; f(N, x) is
    ∑_y f y x; d(S') and c(S, S') are written ∑ x ∈ Sᶜ, d x and ∑ x ∈ S, ∑ y ∈ Sᶜ, c x y. In
    Problem I the integers a_i, b_j are nonnegative (Gale assumes them positive), indexed by Fin m
    and Fin n; the dual sequence a*_j (j ≥ 1) is written #{i | j < a i} for j ≥ 0 (that is,
    a*_{j+1}), and Gale's condition for all k is stated for k ≤ n (it is automatic for k > n with
    b_j = 0 beyond n). The graph of Hoffman's theorem is a finite arc type with tail and head maps
    (parallel arcs and loops allowed); δ^in(U) and δ^out(U) are the arcs entering and leaving U;
    a circulation has, at every vertex, the same total on the arcs entering and leaving it.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent compared
    the statements with Gale's paper (Feasibility Theorem, Remark, second formulation, Problem I)
    and with Theorems 4.6 and 4.7 of Schrijver's course, and checked the degenerate cases (empty
    node set, S = ∅ and S = N, no rows or no columns, no arcs). The author directed the work and
    chose the results. No independent human review of the formalization has been performed. The
    results are classical; no mathematical novelty is claimed.

