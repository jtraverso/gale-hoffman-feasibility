sources:
  - title: "A theorem on flows in networks"
    authors:
      - "David Gale"
    id: "doi:10.2140/pjm.1957.7.1073"
    type: "paper"
    location: "Pacific Journal of Mathematics 7 (1957), 1073–1082; Feasibility Theorem, Remark, second formulation (§2) and the theorem on Problem I (§3)."
    relationship: "formalizes"
    note: >-
      Formalized: the Feasibility Theorem for finite nonnegative real capacities, its integral
      version (Remark), the second formulation, and the criterion for Problem I (0-1 matrices with
      row sums at most a_i and column sums b_j), with the Gale–Ryser corollary for equal totals.
      Not formalized: infinite capacities, the general ordered-group version, the duality
      {a_i}** = {a_i} of dual sequences, and the n-step filling procedure. The proof of the
      Feasibility Theorem follows Gale's (super source and sink, minimum cut); the criterion for
      Problem I is derived from the integral Feasibility Theorem by an unsorted criterion instead of
      Gale's second formulation. The formalization is by a different author; the article's author
      was not involved.
    license: "unknown"
    author_endorsement: "n/a"
