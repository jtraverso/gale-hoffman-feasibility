status:
  scope: >-
    Eight statements: Gale's Feasibility Theorem over ℝ and over ℤ, its second formulation, Gale's
    criterion for 0-1 matrices with row sums at most a_i and column sums b_j (unsorted and sorted
    forms), the Gale–Ryser theorem for equal totals, and Hoffman's circulation theorem over ℝ and
    over ℤ. Not formalized: infinite capacities, Gale's n-step procedure for Problem I, the duality
    of dual sequences, and Schrijver's Exercise 4.13.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

